hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  max_prompt_length: 4096
  max_response_length: 32000

actor_rollout_ref:
  rollout:
    val_kwargs:
      max_response_length: 32768

reward:
  reward_manager:
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: false
      len: 0
      penalty_factor: 0.0
      log: false
    max_resp_len: 32000

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: false
    metric: null
    max_num_gen_batches: 0

trainer:
  project_name: router drift control
  val_before_train: false
  test_freq: 10
  save_freq: 30
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
